<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>글쓰기 | 게시판</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <header>
              <!-- 헤더 영역 -->
            <a class="brand" href="index.html">게시판</a>
            <nav>
                <a href="index.html">게시판</a>
                <a class="write-link" href="write.html">글쓰기</a>
                <a class="login-link" href="login.html">로그인</a>
                <button class="logout-button" type="button">로그아웃</button>
            </nav>
        </header>
        <main>
            <h1>글쓰기</h1>
            <form id="write-form">
                <label>제목</label>
                <input id="title" type="text" required placeholder="제목을 입력하세요">
                <label>본문</label>
                <textarea id="content" required placeholder="내용을 입력하세요"></textarea>
                <button type="submit">등록</button>
                <a href="index.html">목록으로</a>
            </form>
        </main>
        <footer>
            게시판 실습
        </footer>
    </body>
</html>
